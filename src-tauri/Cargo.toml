[package]
name = "aidb-desk"
version = "0.1.0"
description = "AIDB Desk - AI-Powered Database Client"
authors = ["AIDB Dev Team"]
edition = "2021"

[lib]
name = "aidb_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"

# Database SQLx Engine (PostgreSQL, MySQL, SQLite)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "bigdecimal"
] }

# AI Agent Framework (Rig & HTTP Client)
rig-core = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }

# Security & Encryption Vault
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"

# SQL Parsing & Safety AST Inspector
sqlparser = "0.54"

# Structured Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
encoding_rs = "0.8"
urlencoding = "2.1"

