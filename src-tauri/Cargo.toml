[package]
name = "aidb-desk"
version = "0.1.0"
description = "AIDB Desk - AI-Powered Database Client"
authors = ["AIDB Dev Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"

# Database SQLx Engine (PostgreSQL, MySQL, SQLite)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "bigdecimal"
] }
bigdecimal = "0.4"

# AI Agent Framework (HTTP Client, OpenAI-compatible; rig-core 已按 WP2 会议9决议移除——声明未用, 直连更可控)
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"

# Security & Encryption Vault
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hkdf = "0.12"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
secrecy = "0.8"

# SQL Parsing & Safety AST Inspector
sqlparser = "0.54"

# Structured Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
encoding_rs = "0.8"
urlencoding = "2.1"

# WP3: SSH 隧道 (纯 Rust, tokio 原生; 选型见 docs/plans/WP3-ssh-tunnel.md 会议1)
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
dirs = "7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# WP7: Xcode 27 beta ld (ld-27037) 对 release 优化的 proc-macro dylib 产生
# "mis-aligned LINKEDIT string pool" 导致 dlopen 失败 (sqlx_macros)。
# build-override 让 build-deps/proc-macro 以 dev 等效方式链接, 规避该工具链 bug;
# 最终二进制仍为完整 release 优化。待 Xcode 正式版修复后可移除。
[profile.release.build-override]
opt-level = 0
debug = false
strip = "none"
